<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Blood sugar: fingertip sample, step by step</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b3d91"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55607a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b3d91">Blood sugar: fingertip sample, step by step</text>
<rect x="20" y="52" width="166" height="360" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><circle cx="44" cy="78" r="12" fill="#0b3d91"/><text x="44" y="83" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="62" y="83" font-size="14" font-weight="700" fill="#27324d">Wash and dry</text><rect x="194" y="52" width="166" height="360" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><circle cx="218" cy="78" r="12" fill="#0b3d91"/><text x="218" y="83" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="236" y="83" font-size="14" font-weight="700" fill="#27324d">Lance the side</text><rect x="368" y="52" width="166" height="360" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><circle cx="392" cy="78" r="12" fill="#0b3d91"/><text x="392" y="83" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="410" y="83" font-size="14" font-weight="700" fill="#27324d">Wipe first drop</text><rect x="542" y="52" width="166" height="360" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><circle cx="566" cy="78" r="12" fill="#0b3d91"/><text x="566" y="83" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="584" y="83" font-size="14" font-weight="700" fill="#27324d">Touch the strip</text><path d="M80 110h46v14h-10v10h-26v-10h-10z" fill="#b9c4d6" stroke="#27324d" stroke-width="2"/><path d="M103 150c-5 7-7 10-7 13a7 7 0 0 0 14 0c0-3-2-6-7-13z" fill="#7fb2f0" stroke="#0b3d91" stroke-width="1.2"/><path d="M92 172c-5 7-7 10-7 13a7 7 0 0 0 14 0c0-3-2-6-7-13z" fill="#7fb2f0" stroke="#0b3d91" stroke-width="1.2"/><path d="M115 180c-5 7-7 10-7 13a7 7 0 0 0 14 0c0-3-2-6-7-13z" fill="#7fb2f0" stroke="#0b3d91" stroke-width="1.2"/><path d="M103 198c-5 7-7 10-7 13a7 7 0 0 0 14 0c0-3-2-6-7-13z" fill="#7fb2f0" stroke="#0b3d91" stroke-width="1.2"/><path d="M59.0 340V255.0A23.0 23.0 0 0 1 105.0 255.0V340" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M67.0 325.0q15.0 10 30 0M67.0 365.0q15.0 10 30 0" stroke="#e9c6ae" stroke-width="2" fill="none"/><path d="M103.0 340V247.0A23.0 23.0 0 0 1 149.0 247.0V340" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M111.0 317.0q15.0 10 30 0M111.0 357.0q15.0 10 30 0" stroke="#e9c6ae" stroke-width="2" fill="none"/><text x="34" y="366" font-size="12.5" fill="#55607a">Warm water helps</text><text x="34" y="382" font-size="12.5" fill="#55607a">blood flow. Dry fully:</text><text x="34" y="398" font-size="12.5" fill="#55607a">water dilutes the drop.</text><path d="M242.0 330V155.0A35.0 35.0 0 0 1 312.0 155.0V330" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M250.0 225.0q27.0 10 54 0M250.0 265.0q27.0 10 54 0" stroke="#e9c6ae" stroke-width="2" fill="none"/><path d="M242.0 160A35 35 0 0 1 255.0 128" stroke="#12784a" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/><path d="M312.0 160A35 35 0 0 0 299.0 128" stroke="#12784a" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/><ellipse cx="277.0" cy="172" rx="16" ry="20" fill="none" stroke="#55607a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="277.0" y="177" font-size="11" fill="#55607a" text-anchor="middle">pad</text><g transform="translate(311.0 140) rotate(-35)"><rect x="6" y="-9" width="70" height="18" rx="8" fill="#eef2f8" stroke="#27324d" stroke-width="2"/><rect x="0" y="-5" width="8" height="10" fill="#b9c4d6" stroke="#27324d" stroke-width="1.5"/></g><text x="208" y="364" font-size="12.5" font-weight="700" fill="#12784a">Green: sides of the tip</text><text x="208" y="382" font-size="12.5" fill="#55607a">Fewer nerve endings,</text><text x="208" y="398" font-size="12.5" fill="#55607a">less painful than the pad.</text><path d="M406.0 340V165.0A35.0 35.0 0 0 1 476.0 165.0V340" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M414.0 235.0q27.0 10 54 0M414.0 275.0q27.0 10 54 0" stroke="#e9c6ae" stroke-width="2" fill="none"/><circle cx="479.0" cy="150" r="8" fill="#c62828"/><g transform="translate(495.0 176) rotate(-20)"><rect x="0" y="0" width="54" height="44" rx="4" fill="#fff" stroke="#27324d" stroke-width="2"/><path d="M8 12h38M8 22h38M8 32h38" stroke="#d5ddeb" stroke-width="2"/><circle cx="14" cy="10" r="6" fill="#c62828" opacity=".6"/></g><path d="M491.0 124q30 4 34 40" stroke="#0b3d91" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="382" y="382" font-size="12.5" fill="#55607a">The first drop can hold</text><text x="382" y="398" font-size="12.5" fill="#55607a">tissue fluid. Use the next.</text><rect x="622" y="230" width="70" height="120" rx="12" fill="#eef2f8" stroke="#27324d" stroke-width="2"/><rect x="630" y="244" width="54" height="38" rx="4" fill="#0a1f44"/><text x="657" y="270" font-size="18" font-weight="700" fill="#5fe0a3" text-anchor="middle">15</text><circle cx="657" cy="320" r="9" fill="#d5ddeb" stroke="#27324d" stroke-width="1.5"/><rect x="602" y="214" width="14" height="50" rx="2" fill="#f5e9b8" stroke="#27324d" stroke-width="1.5" transform="rotate(0)"/><rect x="602" y="262" width="34" height="0" /><path d="M609 216V206" stroke="#c62828" stroke-width="3"/><g transform="translate(572 112) rotate(-14)"><path d="M-2.0 120V22.0A22.0 22.0 0 0 1 42.0 22.0V120" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M6.0 92.0q14.0 10 28 0M6.0 132.0q14.0 10 28 0" stroke="#e9c6ae" stroke-width="2" fill="none"/></g><circle cx="606" cy="204" r="7" fill="#c62828"/><text x="556" y="366" font-size="12.5" fill="#55607a">Touch the drop to the</text><text x="556" y="382" font-size="12.5" fill="#55607a">strip edge. In microgravity</text><text x="556" y="398" font-size="12.5" fill="#55607a">it will not drip; it clings.</text><text x="24" y="444" font-size="12.5" fill="#55607a">Measure fasting: before your first meal and at least 8 hours after eating. Dispose of the lancet in the sharps container.</text></svg>
