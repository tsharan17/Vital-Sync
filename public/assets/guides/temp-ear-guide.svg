<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Thermometer: forehead sweep or ear</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b3d91"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55607a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b3d91">Thermometer: forehead sweep or ear</text>
<rect x="20" y="52" width="334" height="370" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><rect x="366" y="52" width="334" height="370" rx="14" fill="#f6f8fc" stroke="#d5ddeb"/><text x="36" y="80" font-size="15" font-weight="700" fill="#27324d">A  Forehead (temporal) sweep</text><text x="382" y="80" font-size="15" font-weight="700" fill="#27324d">B  Ear (tympanic)</text><g transform="translate(60 100) scale(1.12)"><path d="M60 20C110 0 165 20 170 70L172 80C174 88 168 92 170 96L186 122C188 126 184 130 178 130L176 136C182 140 182 146 176 148C182 152 180 158 174 160C172 170 176 178 168 186C160 196 140 198 130 192L128 230H70L72 190C40 180 20 130 24 90C26 50 40 28 60 20Z" fill="#f3d9c6" stroke="#27324d" stroke-width="1.7857142857142856"/><path d="M60 20C110 0 165 20 168 62C150 48 122 44 100 52C78 60 66 78 60 100C54 118 52 140 54 162C30 140 20 110 24 90C26 50 40 28 60 20Z" fill="#5a4636"/><path d="M90 94C106 88 116 106 110 122C106 134 96 138 88 132C94 124 96 108 90 94Z" fill="#e9c6ae" stroke="#27324d" stroke-width="1.4285714285714286"/><circle cx="96" cy="114" r="3" fill="#27324d"/><path d="M156 98q8-3 12 1" stroke="#27324d" stroke-width="1.7857142857142856" fill="none"/><path d="M152 90q10-6 18-2" stroke="#5a4636" stroke-width="2.6785714285714284" fill="none"/></g><path d="M245.92000000000002 158.24Q215.68 132.24 185.44 167.2" stroke="#0b3d91" stroke-width="3.5" fill="none" marker-end="url(#ar)"/><g transform="translate(251.92000000000002 152.24) rotate(-40)"><rect x="0" y="-11" width="96" height="22" rx="11" fill="#eef2f8" stroke="#27324d" stroke-width="2"/><rect x="34" y="-6" width="30" height="12" rx="2" fill="#0b3d91"/><circle cx="4" cy="0" r="6" fill="#b9c4d6" stroke="#27324d" stroke-width="1.5"/></g><circle cx="34" cy="371" r="12" fill="#0b3d91"/><text x="34" y="376" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="52" y="376" font-size="14" font-weight="400" fill="#27324d" text-anchor="start">Start mid-forehead, sweep to</text><text x="52" y="394" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">the hairline at the temple; keep it flat</text><g transform="translate(410 100) scale(1.12)"><path d="M60 20C110 0 165 20 170 70L172 80C174 88 168 92 170 96L186 122C188 126 184 130 178 130L176 136C182 140 182 146 176 148C182 152 180 158 174 160C172 170 176 178 168 186C160 196 140 198 130 192L128 230H70L72 190C40 180 20 130 24 90C26 50 40 28 60 20Z" fill="#f3d9c6" stroke="#27324d" stroke-width="1.7857142857142856"/><path d="M60 20C110 0 165 20 168 62C150 48 122 44 100 52C78 60 66 78 60 100C54 118 52 140 54 162C30 140 20 110 24 90C26 50 40 28 60 20Z" fill="#5a4636"/><path d="M90 94C106 88 116 106 110 122C106 134 96 138 88 132C94 124 96 108 90 94Z" fill="#e9c6ae" stroke="#27324d" stroke-width="1.4285714285714286"/><circle cx="96" cy="114" r="3" fill="#27324d"/><path d="M156 98q8-3 12 1" stroke="#27324d" stroke-width="1.7857142857142856" fill="none"/><path d="M152 90q10-6 18-2" stroke="#5a4636" stroke-width="2.6785714285714284" fill="none"/></g><path d="M517.52 200.8L488.4 164.96" stroke="#0b3d91" stroke-width="3.5" marker-end="url(#ar)"/><g transform="translate(517.52 227.68) rotate(118)"><path d="M0 -5L18 -9V9L0 5Z" fill="#b9c4d6" stroke="#27324d" stroke-width="1.5"/><rect x="18" y="-14" width="100" height="28" rx="12" fill="#eef2f8" stroke="#27324d" stroke-width="2"/><rect x="58" y="-7" width="32" height="14" rx="2" fill="#0b3d91"/></g><circle cx="398" cy="365" r="12" fill="#0b3d91"/><text x="398" y="370" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="416" y="370" font-size="14" font-weight="400" fill="#27324d" text-anchor="start">Pull the ear gently up and back</text><circle cx="398" cy="393" r="12" fill="#0b3d91"/><text x="398" y="398" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="416" y="398" font-size="14" font-weight="400" fill="#27324d" text-anchor="start">Aim the probe at the opposite eye</text><text x="24" y="444" font-size="12.5" fill="#55607a">Same thermometer, same site, every day. Hold still for the 30-second dwell or until it beeps.</text></svg>
