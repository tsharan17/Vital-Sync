"700" fill="#27324d" text-anchor="start">Cuff at heart level</text><text x="236" y="166" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">on the bare upper arm</text><path d="M234 160L198 196" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="198" cy="196" r="3.5" fill="#0b3d91"/><circle cx="272" cy="295" r="12" fill="#0b3d91"/><text x="272" y="300" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="290" y="300" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Arm supported</text><text x="290" y="318" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">palm up, strapped</text><path d="M288 286L286 246" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="286" cy="246" r="3.5" fill="#0b3d91"/><circle cx="288" cy="347" r="12" fill="#0b3d91"/><text x="288" y="352" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="306" y="352" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Feet flat</text><text x="306" y="370" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">legs uncrossed</text><path d="M294 362L292 388" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="292" cy="388" r="3.5" fill="#0b3d91"/><rect x="452" y="54" width="252" height="370" rx="14" fill="#f6f8fc" stroke="#d5ddeb" stroke-width="1.5"/><text x="468" y="80" font-size="14" font-weight="700" fill="#0b3d91">Close-up: inner upper arm</text><path d="M462 188H612Q622 196 640 194H704V274H640Q622 270 612 278H462Z" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M462 214C520 218 580 226 614 236C640 244 670 246 704 248" stroke="#c62828" stroke-width="4" fill="none"/><path d="M614 200q-8 36 0 72" stroke="#27324d" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/><rect x="472" y="180" width="102" height="104" rx="6" fill="#8fa9d6" stroke="#27324d" stroke-width="2" opacity=".96"/><path d="M472 196H574M472 268H574" stroke="