<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Pulse oximeter: finger position</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b3d91"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55607a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b3d91">Pulse oximeter: finger position</text>
<path d="M20 330H480" stroke="#9aa6bd" stroke-width="2"/><path d="M-4 268L72 258Q120 246 196 240L400 236Q418 236 420 250Q418 264 400 266L250 268Q262 290 246 312Q230 328 196 326L120 322Q90 326 72 314L-4 312Z" fill="#f3d9c6" stroke="#27324d" stroke-width="2"/><path d="M150 270q50 6 100 0M150 296q50 6 94 2M150 316q40 4 70 2" stroke="#e9c6ae" stroke-width="2" fill="none"/><path d="M250 268Q262 290 246 312" stroke="#27324d" stroke-width="2" fill="none"/><path d="M60 312Q70 326 90 328" stroke="#27324d" stroke-width="2" fill="none"/><path d="M-4 258H40V322H-4Z" fill="#cfdcf0" stroke="#27324d" stroke-width="2"/><path d="M368 238Q390 232 410 238" stroke="#27324d" stroke-width="2" fill="#fbeee6"/><rect x="292" y="196" width="150" height="40" rx="16" fill="#eef2f8" stroke="#27324d" stroke-width="2" opacity=".93"/><rect x="292" y="266" width="150" height="34" rx="14" fill="#eef2f8" stroke="#27324d" stroke-width="2" opacity=".93"/><path d="M296 236Q300 250 296 266M296 236" stroke="#27324d" stroke-width="2" fill="none"/><rect x="424" y="236" width="10" height="30" fill="#b9c4d6" stroke="#27324d" stroke-width="1.5"/><circle cx="452" cy="250" r="12" fill="#eef2f8" stroke="#27324d" stroke-width="2"/><path d="M370 236h28M370 266h28" stroke="#c62828" stroke-width="5"/><path d="M374 241V261" stroke="#c62828" stroke-width="1.6" stroke-dasharray="3 3" opacity=".8"/><path d="M384 241V261" stroke="#c62828" stroke-width="1.6" stroke-dasharray="3 3" opacity=".8"/><path d="M394 241V261" stroke="#c62828" stroke-width="1.6" stroke-dasharray="3 3" opacity=".8"/><rect x="292" y="70" width="190" height="84" rx="10" fill="#0a1f44"/><text x="306" y="96" font-size="11" fill="#9cc3ff">SpO2 %</text><text x="306" y="132" font-size="34" font-weight="700" fill="#5fe0a3">98</text><text x="392" y="96" font-size="11" fill="#9cc3ff">PR bpm</text><text x="392" y="124" font-size="22" font-weight="700" fill="#ffc65c">72</text><path d="M392 142h10l4-8 5 14 4-10 3 4h12l4-8 5 14 4-10 3 4h12" stroke="#5fe0a3" stroke-width="2" fill="none"/><path d="M360 154L362 196" stroke="#0a1f44" stroke-width="2" stroke-dasharray="4 3"/><circle cx="482" cy="179" r="12" fill="#0b3d91"/><text x="482" y="184" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="500" y="184" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Wait for a steady wave</text><text x="500" y="202" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">about 20 seconds, then read</text><path d="M498 188L482 140" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="482" cy="140" r="3.5" fill="#0b3d91"/><circle cx="482" cy="227" r="12" fill="#0b3d91"/><text x="482" y="232" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="500" y="232" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Fingertip to the end stop</text><path d="M498 236L432 250" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="432" cy="250" r="3.5" fill="#0b3d91"/><circle cx="482" cy="267" r="12" fill="#0b3d91"/><text x="482" y="272" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="500" y="272" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Nail up, facing the light</text><path d="M498 276L394 240" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="394" cy="240" r="3.5" fill="#0b3d91"/><circle cx="22" cy="367" r="12" fill="#0b3d91"/><text x="22" y="372" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="40" y="372" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Hand still, resting at heart level</text><text x="40" y="390" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">keep it warm; cold fingers read low</text><path d="M150 368L150 316" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="150" cy="316" r="3.5" fill="#0b3d91"/><circle cx="402" cy="367" r="12" fill="#0b3d91"/><text x="402" y="372" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="420" y="372" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">No nail polish or false nails</text><text x="420" y="390" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">they block the light</text><path d="M418 368L400 240" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="400" cy="240" r="3.5" fill="#0b3d91"/><text x="24" y="444" font-size="12.5" fill="#55607a">Red and infrared light passes through the fingertip; oxygen-rich and oxygen-poor blood absorb it differently.</text></svg>
