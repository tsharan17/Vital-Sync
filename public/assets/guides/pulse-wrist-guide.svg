opacity=".35"/><path d="M440 -10L560 -10L520 40L452 52Z" fill="#cfdcf0" stroke="#27324d" stroke-width="2"/><line x1="424" y1="84" x2="350" y2="200" stroke="#27324d" stroke-width="30" stroke-linecap="round"/><line x1="424" y1="84" x2="350" y2="200" stroke="#e9c6ae" stroke-width="26" stroke-linecap="round"/><line x1="452" y1="86" x2="378" y2="198" stroke="#27324d" stroke-width="30" stroke-linecap="round"/><line x1="452" y1="86" x2="378" y2="198" stroke="#e9c6ae" stroke-width="26" stroke-linecap="round"/><ellipse cx="357" cy="188" rx="8" ry="11" transform="rotate(33 357 188)" fill="#f7e7dc" stroke="#27324d" stroke-width="1.4"/><ellipse cx="385" cy="186" rx="8" ry="11" transform="rotate(33 385 186)" fill="#f7e7dc" stroke="#27324d" stroke-width="1.4"/><path d="M408 30Q430 20 470 24L520 34Q530 52 512 70L476 96Q440 104 412 92Q398 70 408 30Z" fill="#e9c6ae" stroke="#27324d" stroke-width="2"/><path d="M486 86q14-4 20-16M496 92q14-2 22-14" stroke="#27324d" stroke-width="1.6" fill="none"/><circle cx="24" cy="107" r="12" fill="#0b3d91"/><text x="24" y="112" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="42" y="112" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Index and middle fingertips</text><text x="42" y="130" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">press lightly; not your thumb</text><path d="M254 108L352 190" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="352" cy="190" r="3.5" fill="#0b3d91"/><circle cx="24" cy="181" r="12" fill="#0b3d91"/><text x="24" y="186" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="42" y="186" font-size="14" font-weight="700" fill="#c62828" text-anchor="start">Radial artery</text><path d="M140 194L220 222" stroke="#c62828" stroke-width="1.5" fill="none"/><circle cx="220" cy="222" r="3.5" fill="#c62828"/><circle cx="572" cy="127" r="12" fill="#0b3d91"/><text x="572" y="132" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="590" y="132" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Thumb side</text><path d="M586 140L536 140" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="536" cy="140" r="3.5" fill="#0b3d91"/><circle cx="282" cy="355" r="12" fill="#0b3d91"/><text x="282" y="360" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="300" y="360" font-size="14" font-weight="700" fill="#27324d" text-anchor="start">Just above the wrist crease</text><text x="300" y="378" font-size="13" font-weight="400" fill="#55607a" text-anchor="start">on the thumb side of the inner wrist</text><path d="M330 342L368 226" stroke="#0b3d91" stroke-width="1.5" fill="none"/><circle cx="368" cy="226" r="3.5" fill="#0b3d91"/><text x="420" y="360" font-size="13" fill="#55607a"> </text><text x="24" y="444" font-size="12.5" fill="#55607a">Your thumb has its own pulse and can mislead the count. Count for the full 60 seconds, tapping once per beat.</text></svg>
